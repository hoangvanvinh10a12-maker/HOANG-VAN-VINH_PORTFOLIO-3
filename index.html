<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoàng Văn Vinh | Designer Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="hero-shell">
    <div class="hero-stage">
      <div class="hero-backdrop"></div>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <div class="hero-badge">UI/UX Designer · Brand Storyteller</div>
        <div class="hero-header">
          <div class="hero-avatar" aria-label="Personal avatar">
            <span class="avatar-inner">HV</span>
          </div>
          <div class="hero-title-group">
            <h1 class="hero-title">
              <span class="hero-title-strong">Hoàng Văn Vinh</span>
            </h1>
            <p class="hero-subtitle">Crafting emotional digital experiences with timeless visual storytelling.</p>
          </div>
        </div>
        <p class="hero-description">Premium product design for ambitious brands, blending strategic clarity with cinematic, polished interfaces.</p>
        <div class="hero-actions">
          <a href="#work" class="button button-primary">View Portfolio</a>
          <a href="#contact" class="button button-secondary">Let's Connect</a>
        </div>
      </div>
      <div class="leaves" aria-hidden="true"></div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
